name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hub" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: ai-learning-evaluation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            ai-learning-evaluation/requirements.txt
            ai-learning-evaluation/server/requirements.txt
      - name: Install a virtual display for the Tk desktop tests
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Install dependencies
        run: pip install -r server/requirements.txt
      - name: Run test suite (desktop, SQLite and disposable Postgres)
        env:
          INSIGHT_HUB_TEST_DATABASE_URL: postgresql://hub:hub@127.0.0.1:5432/hub
        run: xvfb-run -a python ../tools/testsuit.py --postgres --strict-skips --no-color
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results
          path: test-results/latest/
          retention-days: 7

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            ai-learning-evaluation/requirements.txt
            ai-learning-evaluation/server/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r ai-learning-evaluation/server/requirements.txt
      - name: Verify the PowerShell launcher and non-GUI checks
        run: .\testsuit.ps1 --headless --no-color
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: test-results/latest/
          retention-days: 7
